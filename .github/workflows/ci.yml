name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Confirm native architecture
        run: test "$(uname -m)" = arm64
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build the app
        run: zsh build.sh
      - name: Native checks
        run: '"dist/Scan Connector for Mac.app/Contents/MacOS/Scan Connector for Mac" --self-test'
      - name: Fixture integration tests
        run: python test_integration.py
      - name: Audit release inputs
        run: python scripts/audit_release.py
